<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masters - Page Not Found</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root{
    --background:#0b0d12; --surface:#141822; --foreground:#f4f3ec;
    --foreground-muted:#a6acbb; --accent:#39ff88; --accent-3:#ffd166;
    --border:#2b3040; --border-strong:#f4f3ec; --red:#ff3b3b;
    --font-display:"Press Start 2P", ui-monospace, monospace;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--background); color:var(--foreground);
    font-family:var(--font-mono);
    background-image:
      repeating-linear-gradient(0deg, rgb(255 255 255 / 2%) 0px, rgb(255 255 255 / 2%) 1px, transparent 1px, transparent 4px);
    display:flex; min-height:100%;
  }
  main{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; padding:64px 24px; text-align:center;
  }
  .tag{ margin:0; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--foreground-muted); }
  h1{
    margin:0; font-family:var(--font-display); color:var(--red);
    font-size:clamp(28px,7vw,44px); line-height:1.4;
    animation:blink 1.1s steps(1,end) infinite;
  }
  .path-line{ margin:0; font-size:13px; letter-spacing:.03em; text-transform:uppercase; color:var(--accent-3); overflow-wrap:anywhere; max-width:560px; }
  .path-line code{ font-family:var(--font-mono); background:var(--surface); border:1px solid var(--border); padding:2px 6px; color:var(--accent-3); }
  table{ border-collapse:collapse; width:100%; max-width:420px; font-size:12px; margin-top:4px; }
  td{ padding:8px 10px; border-top:1px dashed var(--border); text-align:left; color:var(--foreground-muted); }
  td:last-child{ text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td{ color:var(--accent); }
  .btn{
    display:inline-block; margin-top:8px;
    border:3px solid var(--border-strong);
    box-shadow:6px 6px 0 0 var(--accent);
    background:var(--accent); color:var(--background);
    padding:12px 24px; font-family:var(--font-mono); font-size:13px;
    text-transform:uppercase; letter-spacing:.05em; text-decoration:none;
    transition:transform 150ms ease-out, box-shadow 150ms ease-out;
  }
  .btn:hover{ transform:translate(2px,2px); box-shadow:none; }
  .btn:active{ transform:translate(6px,6px); box-shadow:none; }
  .btn:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }

  @keyframes blink{ 0%,55%{ opacity:1; } 56%,100%{ opacity:.25; } }

  @media (prefers-reduced-motion: reduce){
    h1{ animation:none; }
    .btn{ transition:none; }
  }
</style>
</head>
<body>
  <main>
    <p class="tag">Session terminated</p>
    <h1>GAME OVER</h1>
    <p class="path-line"><code id="reqPath">&hellip;</code> not found</p>

    <table aria-label="Visitor info">
      <tbody>
        <tr><td>Browser</td><td id="metaBrowser">&hellip;</td></tr>
        <tr><td>Operating system</td><td id="metaOS">&hellip;</td></tr>
        <tr><td>IP address</td><td id="metaIP">&hellip;</td></tr>
        <tr><td>Location</td><td id="metaLoc">&hellip;</td></tr>
      </tbody>
    </table>

    <a class="btn" href="/">Press start &#9656; Cohort home</a>
  </main>

  <script>
    (function () {
      var pathEl = document.getElementById('reqPath');
      pathEl.textContent = (location.pathname + location.search) || '/';

      var ua = navigator.userAgent || '';
      var browser = 'Unknown';
      if (/Edg\//.test(ua)) browser = 'Edge';
      else if (/OPR\//.test(ua)) browser = 'Opera';
      else if (/Chrome\//.test(ua) && !/Chromium/.test(ua)) browser = 'Chrome';
      else if (/Firefox\//.test(ua)) browser = 'Firefox';
      else if (/Safari\//.test(ua) && /Version\//.test(ua)) browser = 'Safari';
      document.getElementById('metaBrowser').textContent = browser;

      var os = 'Unknown';
      if (/Windows/.test(ua)) os = 'Windows';
      else if (/Mac OS X/.test(ua)) os = 'macOS';
      else if (/Android/.test(ua)) os = 'Android';
      else if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
      else if (/Linux/.test(ua)) os = 'Linux';
      document.getElementById('metaOS').textContent = os;

      var ipEl = document.getElementById('metaIP');
      var locEl = document.getElementById('metaLoc');

      fetch('https://get.geojs.io/v1/ip/geo.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          ipEl.textContent = data.ip || 'Unknown';
          var loc = [data.city, data.country].filter(Boolean).join(', ');
          locEl.textContent = loc || 'Unknown';
        })
        .catch(function () {
          ipEl.textContent = 'Unknown';
          locEl.textContent = 'Unknown';
        });
    })();
  </script>
</body>
</html>
